name: Build APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Warn if google-services.json is missing
        run: test -f android/app/google-services.json || echo "::warning::android/app/google-services.json is missing, Google sign-in will not work in this APK"

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CCTV-Technicians-TN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CCTV-Technicians-TN-apk
          path: app/CCTV-Technicians-TN.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CCTV-Technicians-TN.apk \
            --title "CCTV Technicians TN (latest build)" \
            --notes "Debug-signed test build from commit ${GITHUB_SHA::7}. Install on Android and allow installs from this source. Signing SHA-1 for Firebase: 23:62:6F:E3:A2:DC:15:F6:9A:1E:B1:D3:A7:11:9A:DD:59:7B:3D:66"
